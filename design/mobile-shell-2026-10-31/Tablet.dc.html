<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartalith mobile shell — tablet 1194</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0a0b0c}</style>
</helmet>
<div style="width:1194px;height:834px;overflow:hidden;background:#101112">
<dc-import name="Shell" w="{{ w }}" h="{{ h }}" light="{{ light }}" coach="{{ false }}" hint-size="1194px,834px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false,"section":"Device"},"$preview":{"width":1194,"height":834}}'>
/* An 11-inch tablet in landscape (1194 × 834 dp): the desktop shell with touch sizing, both docks docked. */
class Component extends DCLogic {
  renderVals() { return { w: 1194, h: 834, light: !!this.props.light }; }
}
</script>
</body>
</html>
