<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartalith map context — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0e0f;font-family:'IBM Plex Sans',sans-serif;color:#e8ebec}
a{color:#e0a34a}a:hover{color:#f0b85e}
.crow{cursor:pointer}.crow:active{background:#2b3034}
.chips::-webkit-scrollbar{display:none}
@keyframes hpulse{from{transform:scale(.7);opacity:.9}to{transform:scale(2.2);opacity:0}}
.hpulse{animation:hpulse .45s ease-out forwards}
@keyframes holdgrow{from{transform:scale(.25);opacity:.25}to{transform:scale(1);opacity:1}}
.holdring{animation:holdgrow .48s linear forwards}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0d0e0f; font-family: 'IBM Plex Sans', sans-serif; color: #e8ebec">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 52px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: #121314; border-bottom: 1px solid #2a2d30">
<div style="font: 500 12px/1 'IBM Plex Mono', monospace; letter-spacing: .22em; color: #e0a34a">CARTALITH</div>
<div style="font: 10.5px/1 'IBM Plex Mono', monospace; color: #8d9296">{{domainUpper}} · phone</div>
<div style="flex-grow: 1"></div>
<div style="font: 10px/1 'IBM Plex Mono', monospace; color: #8d9296">long-press = pin</div>
</div>

<div style="position: absolute; left: 0; top: 52px; width: 390px; height: 728px; overflow: hidden; background: {{m.sea}}" onContextMenu="{{prevent}}">
<div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="position: absolute; left: 0; top: 0; width: 390px; height: 728px; touch-action: none; user-select: none">
<svg width="390" height="728" style="position: absolute; left: 0; top: 0; display: block">
<g transform="translate({{m.panX}} {{m.panY}})">
<polygon points="{{m.landPts}}" style="fill: {{m.landFill}}; stroke: {{m.coast}}; stroke-width: 1.5"></polygon>
<polygon points="{{m.terrL}}" style="fill: {{m.terrLFill}}; stroke: none"></polygon>
<polygon points="{{m.terrR}}" style="fill: {{m.terrRFill}}; stroke: none"></polygon>
<path d="{{m.ridgeD}}" style="fill: none; stroke: {{m.ridge}}; stroke-width: 2; stroke-linejoin: round"></path>
<path d="{{m.riverD}}" style="fill: none; stroke: #6fa8cf; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"></path>
<circle cx="{{m.lakeX}}" cy="{{m.lakeY}}" r="{{m.lakeR}}" style="fill: #4f86ad; stroke: #6fa8cf; stroke-width: 1"></circle>
<path d="{{m.waysD}}" style="fill: none; stroke: #c9b48a; stroke-width: 2.5"></path>
<path d="{{m.routeD}}" style="fill: none; stroke: #e8d7a8; stroke-width: 2; stroke-dasharray: 6 5"></path>
<path d="{{m.wayDraftD}}" style="fill: none; stroke: #e0a34a; stroke-width: 2; stroke-dasharray: 3 4"></path>
<path d="{{m.measureD}}" style="fill: none; stroke: #f2f2f2; stroke-width: 1.5; stroke-dasharray: 2 3"></path>
</g>
</svg>
<sc-for list="{{m.committed}}" as="k" hint-placeholder-count="0">
<div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; width: {{k.s}}px; height: {{k.s}}px; border-radius: 50%; background: rgba(240,230,210,.18); border: 1px solid rgba(240,230,210,.45); pointer-events: none"></div>
</sc-for>
<sc-for list="{{m.drafts}}" as="k" hint-placeholder-count="0">
<div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; width: {{k.s}}px; height: {{k.s}}px; border-radius: 50%; box-sizing: border-box; border: 1.5px dashed {{k.c}}; background: {{k.bg}}; pointer-events: none"></div>
</sc-for>
<sc-for list="{{m.icons}}" as="k" hint-placeholder-count="1">
<div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; width: 11px; height: 11px; transform: rotate(45deg); box-sizing: border-box; border: 2px solid #e0a34a; background: rgba(0,0,0,.25); pointer-events: none"></div>
</sc-for>
<sc-for list="{{m.settlements}}" as="k" hint-placeholder-count="3">
<div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; width: {{k.s}}px; height: {{k.s}}px; border-radius: 50%; box-sizing: border-box; background: #f2ead8; border: 1.5px solid #2a2418; pointer-events: none"></div>
<div style="position: absolute; left: {{k.nl}}px; top: {{k.nt}}px; font: 500 10.5px/1 'IBM Plex Mono', monospace; color: {{k.ink}}; white-space: nowrap; pointer-events: none; text-shadow: {{k.halo}}">{{k.name}}</div>
</sc-for>
<sc-for list="{{m.labels}}" as="k" hint-placeholder-count="1">
<div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; transform: translate(-50%, -50%); font: italic 500 11px/1 'IBM Plex Sans', sans-serif; letter-spacing: .1em; color: {{k.ink}}; white-space: nowrap; pointer-events: none; text-shadow: {{k.halo}}">{{k.text}}</div>
</sc-for>
<sc-if value="{{press.show}}" hint-placeholder-val="{{false}}">
<div class="holdring" style="position: absolute; left: {{press.l}}px; top: {{press.t}}px; width: 64px; height: 64px; border-radius: 50%; box-sizing: border-box; border: 3px solid #e0a34a; pointer-events: none"></div>
</sc-if>
<sc-if value="{{pulse.show}}" hint-placeholder-val="{{false}}">
<div class="hpulse" style="position: absolute; left: {{pulse.l}}px; top: {{pulse.t}}px; width: 64px; height: 64px; border-radius: 50%; box-sizing: border-box; border: 2px solid #e0a34a; pointer-events: none"></div>
</sc-if>
</div>

<sc-if value="{{pin.show}}" hint-placeholder-val="{{false}}">
<button onPointerDown="{{pinDown}}" onPointerMove="{{pinMove}}" onPointerUp="{{pinUp}}" onPointerCancel="{{pinUp}}" aria-label="Sample pin — drag to move" style="position: absolute; left: {{pin.l}}px; top: {{pin.t}}px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center">
<span style="display: block; width: 16px; height: 16px; transform: rotate(45deg); box-sizing: border-box; border: 2.5px solid #e0a34a; background: rgba(224,163,74,.3)"></span>
</button>
<div style="position: absolute; left: {{pin.cl}}px; top: {{pin.ct}}px; padding: 7px 10px; background: #1c1f22; border: 1px solid #6b7277; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.4); pointer-events: none; white-space: nowrap">
<div style="font: 10.5px/1.2 'IBM Plex Mono', monospace; color: #e8ebec">{{pin.l1}}</div>
<div style="font: 9.5px/1.2 'IBM Plex Mono', monospace; color: #b8bdc1">{{pin.l2}}</div>
</div>
</sc-if>

<sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 16px; top: 12px; width: 358px; display: flex; justify-content: center; pointer-events: none">
<div style="max-width: 340px; padding: 9px 14px; background: #1c1f22; border: 1px solid #6b7277; border-radius: 16px; font: 10.5px/1.45 'IBM Plex Mono', monospace; color: #e8ebec; text-align: center">{{toast}}</div>
</div>
</sc-if>

<sc-if value="{{pillOn}}" hint-placeholder-val="{{true}}">
<button onPointerDown="{{pillDown}}" onPointerMove="{{pillMove}}" onPointerUp="{{pillUp}}" onPointerCancel="{{pillUp}}" aria-label="Armed tool — tap to toggle Inspect, press and slide up for the tool fan" style="position: absolute; left: 101px; top: 668px; width: 188px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid {{pill.border}}; background: {{pill.bg}}; color: {{pill.fg}}; font: 500 10.5px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; touch-action: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
<span style="font-size: 13px">⌃</span><span>{{pill.label}}</span>
</button>
</sc-if>

<sc-if value="{{fanOn}}" hint-placeholder-val="{{false}}">
<button onClick="{{fanScrim}}" aria-label="Close tool fan" style="position: absolute; left: 0; top: 0; width: 390px; height: 728px; border: 0; padding: 0; background: rgba(8,9,10,.55); pointer-events: {{fan.pe}}"></button>
<div style="position: absolute; left: 0; top: 460px; width: 390px; text-align: center; font: 10.5px/1.4 'IBM Plex Mono', monospace; color: #e8ebec; pointer-events: none"><span style="padding: 5px 10px; background: #16181a; border: 1px solid #6b7277; border-radius: 12px">{{fan.caption}}</span></div>
<sc-for list="{{fan.slots}}" as="s" hint-placeholder-count="8">
<button onClick="{{s.click}}" aria-label="{{s.label}}" style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 56px; height: 56px; border-radius: 50%; box-sizing: border-box; padding: 0; border: {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; opacity: {{s.op}}; pointer-events: {{s.pe}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
<span style="font: 15px/1 'IBM Plex Mono', monospace">{{s.glyph}}</span>
<span style="font: 500 8.5px/1 'IBM Plex Mono', monospace">{{s.short}}</span>
</button>
</sc-for>
<sc-if value="{{fan.back}}" hint-placeholder-val="{{false}}">
<button onClick="{{fan.backClick}}" aria-label="Back to the tool fan" style="position: absolute; left: 167px; top: 662px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #e0a34a; background: #e0a34a; color: #141617; font: 600 9px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 0 4px rgba(224,163,74,.25)"><span style="font-size: 18px; letter-spacing: 0">‹</span><span>BACK</span></button>
</sc-if>
</sc-if>

<sc-if value="{{sheetOn}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: {{sheet.top}}px; width: 390px; height: {{sheet.h}}px; box-sizing: border-box; display: flex; flex-direction: column; background: #16181a; border-top: 1px solid #555b60; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.4)">
<div onPointerDown="{{handleDown}}" onPointerMove="{{handleMove}}" onPointerUp="{{handleUp}}" onPointerCancel="{{handleUp}}" style="flex: none; touch-action: none; cursor: grab">
<div style="height: 20px; display: flex; align-items: center; justify-content: center"><div style="width: 42px; height: 4px; border-radius: 2px; background: #7a8186"></div></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 14px 8px">
<div style="flex-grow: 1; min-width: 0">
<div style="font: 600 14px/1.2 'IBM Plex Sans', sans-serif; color: #e8ebec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{card.title}}</div>
<div style="margin-top: 3px; font: 10px/1.3 'IBM Plex Mono', monospace; color: #b8bdc1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{card.subtitle}}</div>
</div>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2b3034; color: #eef0f1; font: 13px/1 'IBM Plex Mono', monospace; cursor: pointer">✕</button>
</div>
</div>
<sc-if value="{{sheet.peek}}" hint-placeholder-val="{{true}}">
<div class="chips" style="flex: none; display: flex; gap: 8px; padding: 2px 14px 10px; overflow-x: auto">
<sc-for list="{{card.chips}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.click}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: 500 11px/1 'IBM Plex Mono', monospace; white-space: nowrap; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<div style="padding: 0 14px; font: 9.5px/1.3 'IBM Plex Mono', monospace; color: #b0b5b9">drag the handle up for every action · drag the pin to move it</div>
</sc-if>
<sc-if value="{{sheet.half}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px">
<sc-if value="{{card.multi}}" hint-placeholder-val="{{false}}">
<button class="crow" onClick="{{card.openSelect}}" style="display: flex; width: 100%; height: 46px; align-items: center; padding: 0 14px; border: 0; border-top: 1px solid #3a3e42; background: transparent; color: #e0a34a; font: 500 11px/1 'IBM Plex Mono', monospace; text-align: left"><span style="flex-grow: 1">{{card.multiLabel}}</span><span>▸</span></button>
</sc-if>
<sc-if value="{{card.inSub}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #3a3e42">
<button class="crow" onClick="{{card.back}}" style="display: flex; width: 100%; height: 46px; align-items: center; padding: 0 14px; border: 0; color: #e0a34a; font: 600 11px/1 'IBM Plex Mono', monospace; text-align: left; background: #202427; border-bottom: 1px solid #3a3e42">‹ BACK  ·  {{card.subTitle}}</button>
<sc-for list="{{card.subRows}}" as="row" hint-placeholder-count="4">
<button class="crow" onClick="{{row.click}}" style="display: flex; width: 100%; height: 46px; align-items: center; padding: 0 14px 0 24px; border: 0; background: transparent; color: {{row.color}}; font: 14px/1 'IBM Plex Sans', sans-serif; text-align: left"><span style="flex-grow: 1">{{row.label}}</span><span style="color: #b0b5b9; font: 11px/1 'IBM Plex Mono', monospace">{{row.hint}}</span></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{card.inMain}}" hint-placeholder-val="{{true}}">
<sc-for list="{{card.secs}}" as="sec" hint-placeholder-count="4">
<div style="border-top: 1px solid #3a3e42; padding: 2px 0">
<div style="padding: 8px 14px 2px; font: 500 9px/1 'IBM Plex Mono', monospace; letter-spacing: .18em; color: #b0b5b9">{{sec.name}}</div>
<sc-for list="{{sec.rows}}" as="row" hint-placeholder-count="2">
<sc-if value="{{row.isAction}}" hint-placeholder-val="{{true}}">
<button class="crow" onClick="{{row.click}}" style="display: flex; width: 100%; height: 46px; align-items: center; gap: 8px; padding: 0 14px; border: 0; background: transparent; color: {{row.color}}; font: 14px/1 'IBM Plex Sans', sans-serif; text-align: left"><span style="flex-grow: 1">{{row.label}}</span><span style="color: #b0b5b9; font: 11px/1 'IBM Plex Mono', monospace">{{row.hint}}</span></button>
</sc-if>
<sc-if value="{{row.isParam}}" hint-placeholder-val="{{false}}">
<div style="display: flex; height: 50px; align-items: center; gap: 8px; padding: 0 14px; font: 14px/1 'IBM Plex Sans', sans-serif; color: #d7dadc">
<span style="flex-grow: 1">{{row.label}}</span>
<button onClick="{{row.minus}}" aria-label="Decrease" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #34383b; background: #191c1e; color: #e8ebec; font-size: 16px; cursor: pointer">−</button>
<span style="width: 64px; text-align: center; font: 12px/1 'IBM Plex Mono', monospace; color: #e0a34a">{{row.value}}</span>
<button onClick="{{row.plus}}" aria-label="Increase" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #34383b; background: #191c1e; color: #e8ebec; font-size: 16px; cursor: pointer">+</button>
</div>
</sc-if>
<sc-if value="{{row.isDisabled}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px 14px">
<div style="font: 14px/1.2 'IBM Plex Sans', sans-serif; color: #a0a6aa">{{row.label}}</div>
<div style="margin-top: 3px; font: 10.5px/1.3 'IBM Plex Mono', monospace; color: #ebc080">{{row.reason}}</div>
</div>
</sc-if>
</sc-for>
</div>
</sc-for>
</sc-if>
</div>
</sc-if>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 0; top: 780px; width: 390px; height: 64px; box-sizing: border-box; padding: 6px 10px 10px; display: flex; gap: 8px; background: #121314; border-top: 1px solid #3a3e42">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-label="{{t.label}} domain" style="flex-grow: 1; flex-basis: 0; height: 48px; border-radius: 14px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px"><span style="font-size: 14px; letter-spacing: 0">{{t.glyph}}</span><span>{{t.label}}</span></button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const W=390,H=728,HOLD=480,SLOP=10,PEEK=176,HALF=470,FAX=195,FAY=690,FR=150,FRI=84,FSLOT=56;
const ACC='#e0a34a';
const VIEWS=['Relief','Biome','Political','Elevation','Slope','Flow','Temp','Rain'];
const STYLES=['Vibrant','Default','Antique','Ink','Watercolor','Print'];
const MEASURE=['Path','Area','Radius','Section','Δ vert.'];
const CLASSES=['metropolis','city','town','village','hamlet'];
const kidsOf=(arr,prefix,family)=>arr.map(l=>({label:l,tool:prefix+' · '+l,family}));
const GLOBAL={
 N:{label:'Inspect',glyph:'↖',tool:'Inspect',family:'global'},
 E:{label:'Measure',glyph:'⟷',children:MEASURE.map(m=>({label:m,tool:'Measure · '+m,family:'global'}))},
 S:{label:'Undo',glyph:'↶',action:'undo'},
 W:{label:'Region',glyph:'⬚',tool:'Region select',family:'global'}};
const DIAG={
 world:{NW:{label:'Uplift',glyph:'▲',children:kidsOf(['Mountains','Hills','Ridge','Plateau','Cliff','Volcano'],'Sculpt','sculpt')},
  NE:{label:'Carve',glyph:'▼',children:kidsOf(['Canyon','Valley','River','Lake','Basin','Coastline'],'Sculpt','sculpt')},
  SE:{label:'Freehand',glyph:'∿',children:kidsOf(['Raise','Lower','Smooth','Cliff','Ridge','Canyon','Mesa','Volcano'],'Freehand','sculpt')},
  SW:{label:'Paint',glyph:'◧',children:kidsOf(['Biome','Terrain','Splat'],'Paint','paint')}},
 civil:{NW:{label:'Settle',glyph:'⌂',children:kidsOf(['Metropolis','City','Town','Village','Hamlet'],'Settlement','settle')},
  NE:{label:'Territory',glyph:'◩',children:kidsOf(['Add','Subtract'],'Territory','territory')},
  SE:{label:'Way',glyph:'═',children:kidsOf(['Road','Track','Trail','Bridge'],'Way','way')},
  SW:{label:'Route',glyph:'⤳',tool:'Route',family:'route'}},
 carto:{NW:{label:'Label',glyph:'Aa',tool:'Label',family:'label'},
  NE:{label:'Icon',glyph:'◇',children:kidsOf(['Settlement','Feature','POI','Custom'],'Icon','icon')},
  SE:{label:'View',glyph:'◐',children:VIEWS.map(v=>({label:v,view:v}))},
  SW:{label:'Style',glyph:'✎',children:STYLES.map(s=>({label:s,style:s}))}}};
function ringDef(dom,dir){return GLOBAL[dir]||DIAG[dom][dir];}
const FAN=[['W',180,FR],['NW',135,FR],['N',90,FR],['NE',45,FR],['E',0,FR],['SW',150,FRI],['S',90,FRI],['SE',30,FRI]];
function fanPos(ang,r){const a=ang*Math.PI/180;return[FAX+r*Math.cos(a),FAY-r*Math.sin(a)];}
const LAND=[[.08,.22],[.22,.10],[.45,.08],[.62,.14],[.80,.12],[.92,.28],[.90,.52],[.82,.72],[.66,.90],[.44,.88],[.26,.80],[.12,.64],[.06,.42]];
const RIVER=[[.36,.13],[.37,.22],[.34,.29],[.36,.40],[.44,.47],[.52,.57],[.63,.64],[.72,.73],[.76,.81]];
const RIDGES=[[[.58,.30],[.62,.22],[.66,.30]],[[.64,.32],[.69,.24],[.74,.33]],[[.70,.22],[.74,.16],[.78,.23]]];
const NAMES=['Orvek','Tamsin Ford','Haldry','Cairnholt','Esk Varrow','Myrren','Dunmoor','Selwick'];
const STYLEPAL={Vibrant:{sea:'#1d3a4f',land:'#5d7a4a',ink:'#f2f0ea',coast:'#9fb88a',ridge:'#3d5230'},Default:{sea:'#23384a',land:'#6b7d5a',ink:'#f2f0ea',coast:'#a6b592',ridge:'#46543a'},Antique:{sea:'#8a7f66',land:'#cdbb8f',ink:'#2f2618',coast:'#6d5c3d',ridge:'#8f7a52'},Ink:{sea:'#dcd8cc',land:'#f7f4ec',ink:'#1b1b1b',coast:'#1b1b1b',ridge:'#6b6b6b'},Watercolor:{sea:'#7fa6b8',land:'#b9c99a',ink:'#22301f',coast:'#5f7a55',ridge:'#7d8f63'},Print:{sea:'#3b5b7a',land:'#d9c9a3',ink:'#1f1f1f',coast:'#1f1f1f',ridge:'#8a7a58'}};
const VIEWTINT={Biome:'#3f7a3a',Elevation:'#7d7d7d',Slope:'#8f6450',Flow:'#2f5f86',Temp:'#a85d38',Rain:'#3a70a6'};
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const xi=P[i][0],yi=P[i][1],xj=P[j][0],yj=P[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const L=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function polyDist(px,py,pts){let d=1e9;for(let i=1;i<pts.length;i++)d=Math.min(d,segDist(px,py,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]));return d;}
function sample(nx,ny){if(!inPoly(nx,ny,LAND))return{land:false,elev:-Math.round(140+2400*Math.abs(Math.sin(nx*7)*Math.cos(ny*5))),biome:'Open sea'};const rid=Math.max(0,1-Math.hypot(nx-.68,ny-.26)/.16);const e=Math.round(40+540*Math.abs(Math.sin(nx*9+ny*4))+2600*rid);const b=e>2200?'Alpine tundra':e>1200?'Montane forest':ny<.3?'Boreal forest':(nx>.6&&ny>.55)?'Warm steppe':'Temperate forest';return{land:true,elev:e,biome:b};}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function faction(nx){return nx<.5?'Aurel':'Kesh';}
