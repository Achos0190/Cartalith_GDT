[package]
name = "cartalith-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Markdown Vault integration (MARKDOWN_VAULT_SCOPE.md): section-aware Markdown reading/writing, the machine-owned Cartalith block, knowledge links and the desktop filesystem vault provider. No Godot types, no engine dependency."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
