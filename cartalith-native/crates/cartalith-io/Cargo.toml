[package]
name = "cartalith-io"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "save/load — reads the HTML app's .zip saves (SAVEFILE_COMPAT.md)"

[lib]
name = "cartalith_io"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", features = ["deflate"] }
