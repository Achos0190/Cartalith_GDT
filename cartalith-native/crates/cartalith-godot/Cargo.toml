[package]
name = "cartalith-godot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The only crate that depends on gdext (ARCHITECTURE.md); boundary layer between Godot and the engine crates."

[lib]
name = "cartalith_godot"
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
cartalith-engine = { path = "../cartalith-engine" }
cartalith-io = { path = "../cartalith-io" }
cartalith-noise = { path = "../cartalith-noise" }
cartalith-civ = { path = "../cartalith-civ" }
cartalith-hydrology = { path = "../cartalith-hydrology" }
cartalith-assets = { path = "../cartalith-assets" }
# `sample_bridge.rs`'s Wind/Ocean-currents debug views (layer-visualization
# pass, `CHANGELOG.md`): `current_wind_field`/`ocean_sst_anomaly` are real
# functions this crate now calls at debug-view-select time, not just under
# `[dev-dependencies]` test harnesses -- promoted from dev-only to a regular
# dependency for exactly that reason.
cartalith-climate = { path = "../cartalith-climate" }
# Same views' coarse-grid sizing (`WW=min(GW,240), WH=round(WW*GH/GW)`,
# reference HTML line 5557) needs `Math.round`'s own tie-break (`js_round`),
# not Rust's `f64::round` -- `cartalith-rust-conventions`' own "V8's libm is
# not Rust's" rule, applied to rounding rather than a transcendental.
cartalith-jsmath = { path = "../cartalith-jsmath" }
# `UNIFIED_TOOL_PLAN.md` milestone F (`STRANDED_TOOLS.md` rows 4-8): the
# Sculpt editor binding needs the feature/preset/stamp registry directly
# (`cartalith-terrain::sculpt`) and the non-destructive draft stack it
# plugs into (`cartalith-spatial::PassBuffer`/`DirtyTracker`). Neither was
# a direct dependency of this crate before -- `cartalith-engine` already
# depended on both, but only re-exported the pieces `generate_terrain`
# itself needed, not the sculpt registry or the raw pass-buffer machinery.
cartalith-terrain = { path = "../cartalith-terrain" }
cartalith-spatial = { path = "../cartalith-spatial" }
# `UNIFIED_TOOL_PLAN.md` milestone F, CIVIL group: `civ_tools_bridge`'s
# manual-placement name/population RNG stream is a `cartalith_rng::Mulberry32`
# field (`cartalith_civ::civ_name_rng`'s own return type) that must be named
# directly outside `cartalith-civ`'s own crate boundary -- a transitive
# dependency cannot be, so this is a new direct one, same precedent as the
# `cartalith-terrain`/`cartalith-spatial` pair added above for Sculpt.
cartalith-rng = { path = "../cartalith-rng" }
# `TERRAIN_APPEARANCE_SCOPE.md` milestone 6. The per-pixel appearance pass was
# the last O(gw*gh) loop in the workspace still running on one core, after
# `CPU_MULTITHREADING_SCOPE.md` milestones 2-3 parallelized civ/climate/
# erosion/hydrology. Same `rayon = "1"` five sibling crates already declare, so
# this adds no new dependency to the tree -- only to this crate's own graph.
rayon = "1"
# `SAVEFILE_COMPAT.md`/FI-01's save writer: `params.rs` builds the save's
# `state` object and reads it back. Not a new dependency in the tree --
# `cartalith-io` (already a dependency above) has declared the same version
# since the reader was written; this only makes it a direct one, the same
# precedent `cartalith-terrain`/`cartalith-spatial` set above.
serde_json = "1.0.151"
# `GUI_GAP_REGISTER.md` CA-08's "Save preset": `TerrainAppearance` (and the
# `Npr` block and `ElevationRamp` inside it) derive `Serialize`/`Deserialize`
# so a named look can be written to and read back from a small JSON file. The
# one Rust line §7.15 said the whole feature depends on. Same version the four
# sibling crates that already derive serde declare, so this is new only to this
# crate's own graph -- and it must be a *regular* dependency, not a dev one,
# because `render.rs` is `#[path]`-included by five separate test targets that
# each compile it as library code.
serde = { version = "1.0.229", features = ["derive"] }

# Multi-GPU (`GUI_GAP_REGISTER.md` PR-01/PR-02/PR-04/PR-05): this was a
# dev-dependency while only the L0 timing harness needed it. The `gpu_*`
# `#[func]` surface (device enumeration, selection, multi-GPU mode, VRAM
# budget) is library code now, so it moved here. Not a new dependency in
# the tree either way -- `cartalith-engine` above already pulls it in.
cartalith-gpu = { path = "../cartalith-gpu" }

# `MARKDOWN_VAULT_SCOPE.md` milestone 1. `vault_bridge.rs` is this crate's
# half of the Markdown Vault integration; every Markdown, section, block and
# link decision lives in `cartalith-vault`, which depends on nothing in this
# workspace and on no Godot type.
cartalith-vault = { path = "../cartalith-vault" }

# The `log` facade, so `lib.rs` can register a backend at the gdext entry
# point. `wgpu` reports everything it knows through this facade -- which
# adapter it selected, why a device request failed, every Vulkan validation
# message -- and until now NO crate in this workspace had ever registered a
# backend, so all of it went to `log`'s default no-op on every platform. Not a
# new dependency in the tree: `wgpu` already pulls the same 0.4 in (0.4.33 in
# `Cargo.lock` before this change, unmoved by it). This only makes it direct.
log = "0.4"

# `EXPORT_SCOPE.md` §7 milestone E2, `export_stream.rs`: a 16K/32K raster is
# written band by band and never held whole, so the encoder must take rows
# incrementally. `image`'s `PngEncoder` takes a whole buffer; `png`'s
# `StreamWriter` does not. Not a new package: 0.18.1 was already resolved in
# `Cargo.lock` through `cartalith-assets`' `image` png feature. This only
# makes it direct.
png = "0.18.1"
# The same module's BigTIFF (§6.1: MIT, pure Rust, so the Android cross-build
# is unaffected). **New to the tree.** `default-features = false` keeps only
# `deflate`; the defaults would add `fax`, `zune-jpeg`, `zune-core` and
# `weezl`, decode-side codecs an export never reads (§6.2). `flate2` and
# `half` were already in the lockfile. Not `zstd`, which is a C library.
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
# `EDITING_TOOLS_SCOPE.md` ET-E1 (Ruling CB item 1): the Display P3 ICC profile
# a P3 export embeds (`export_stream::display_p3_icc`), built by moxcms rather
# than hand-written so the profile's tags are a maintained library's. Not a new
# package: 0.8.1 was already resolved in `Cargo.lock` as a dependency of
# `image` 0.25.10 (with the same default features), so this only makes it
# direct. BSD-3-Clause OR Apache-2.0, pure Rust. Owner-authorised 2026-10-11.
moxcms = "0.8.1"
# `EXPORT_SCOPE.md` E5 (Ruling AZ: "offer JPEG alongside PNG"): the baseline
# JPEG writer in `export_stream::write_jpeg`. **New to the tree, one package,
# no dependencies of its own.** Chosen because its `ImageBuffer` trait asks for
# the image one row at a time, in order (`fill_buffers(y)`, read in 0.7.1's
# `encoder.rs::encode_image_interleaved`), so a 16K/32K raster can be fed band
# by band without being held; it embeds an ICC profile as APP2 segments
# (`add_icc_profile`) and takes a 1-100 quality. Pure Rust, so the Android
# cross-build is unaffected. Licence `(MIT OR Apache-2.0) AND IJG`: the IJG
# part is its forward DCT (`fdct.rs`, ported from mozjpeg), a permissive
# licence whose one condition is an acknowledgement, which `credits.gd` gives;
# `deny.toml` allows `IJG` on that basis. Default features only (`std`): the
# `simd` feature's AVX2 path is not taken, so the bytes do not depend on the
# CPU the export runs on.
jpeg-encoder = "0.7.1"

[dev-dependencies]
# `tests/export_stream.rs`' own PNG and BigTIFF decoders inflate with it;
# already in the lockfile through `png`/`zip`.
flate2 = "1"
# `tests/export_stream.rs`' JPEG checks (E5) decode with the image-rs
# project's decoder, not the encoder's own author's code -- E2's "decode with a
# different decoder than the encoder" bar -- and read the embedded ICC profile
# back through its `icc_profile()`. Test-only and new to the tree; MIT OR
# Apache-2.0. `default-features = false` drops its `rayon` feature, which a
# decode of a test fixture does not need.
jpeg-decoder = { version = "0.3.2", default-features = false }
# `tests/gf0_geology_harness.rs` (GEOLOGY_FIRST_SCOPE.md GF-0, bar B6)
# re-runs `glacial_kernel` alone on the pre-glacial field, so it measures the
# kernel's lowering without the isostatic rebound that follows it, and checks
# kernel + rebound reproduces the generated world bit for bit. Test-only: the
# shipping crate still reaches erosion through `cartalith-engine` alone.
cartalith-erosion = { path = "../cartalith-erosion" }
# `SCULPT_LIVE_SCOPE.md` milestone L0's timing harness
# (`tests/sculpt_live_l0_bench.rs`) needs `compute_temperature`/
# `simulate_weather`/`apply_climate_moisture_correctors` directly to measure
# a standalone "climate refresh" the same way `generate_terrain` chains
# them (`cartalith-climate` itself moved to `[dependencies]` above once
# `sample_bridge.rs` started calling it outside tests too), and
# `cartalith-gpu`'s `_with` GPU flow/weather entry points to measure the
# CPU-vs-GPU comparison the scope asks for -- now a regular dependency
# above (see its comment there), so it is no longer listed here.
# `tests/project_round_trip.rs` asserts the project archive's own entry
# names, order and per-entry byte sizes -- the contract a second
# implementation of `SAVEFILE_COMPAT.md` is written against, so it is
# checked against the real container rather than against the reader that
# shares the writer's code. `cartalith-io` (a dependency above) has
# declared the same version since the MVP; this only makes it visible to
# this crate's test targets.
zip = { version = "8.6.0", features = ["deflate"] }

# The Android half of the logger above -- the half that reaches logcat, which
# is the only place an `ANDROID_BUILD_SCOPE.md` device pass can read a `wgpu`
# line at all. Platform-gated, so no desktop build grows by a single crate:
# the desktop half is `StderrLogger` in `lib.rs`, ~15 lines of `impl log::Log`
# over `eprintln!` and no dependency whatsoever.
#
# `default-features = false` drops the crate's `regex` default and with it
# `env_filter/regex`, leaving only `android_log-sys` (the liblog FFI shim) and
# a regex-less `env_filter`. Nothing is lost: that feature buys per-module
# filter grammar, and an Android app's environment is not settable from `adb`,
# so `RUST_LOG` never arrives on the handset to be parsed.
#
# `init_once` is the entry point, not `init`: it is idempotent by construction
# (`log::set_logger`'s `Err` is logged and swallowed) and the crate ships its
# own `multiple_init` test proving a second call is silently ignored. That is
# what keeps a reload from panicking across the gdext boundary.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15.1", default-features = false }
