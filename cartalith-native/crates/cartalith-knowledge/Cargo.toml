[package]
name = "cartalith-knowledge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Retrieval knowledge base over the Markdown Vault and the world's own data (RAG_KNOWLEDGE_BASE_RESEARCH.md, Ruling DM): world-as-documents renderer, Vault chunker, BM25 index, link expansion, evaluation scorer. No Godot types, no engine dependency, no model, no socket."

[dependencies]
# The Vault's section/frontmatter/link/entity parsers are reused, not re-implemented
# (RK-2: "on markdown::sections, frontmatter_fields, parse_links, parse_entities").
cartalith-vault = { path = "../cartalith-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
