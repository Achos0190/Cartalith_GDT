[package]
name = "cartalith-terrain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "tectonics, height formula, normalize, volcanism, world-structure archetypes, sculpt landform stamps"

[lib]
name = "cartalith_terrain"

[dependencies]
cartalith-jsmath = { path = "../cartalith-jsmath" }
cartalith-noise = { path = "../cartalith-noise" }
cartalith-rng = { path = "../cartalith-rng" }
cartalith-spatial = { path = "../cartalith-spatial" }
rayon = "1"

[dev-dependencies]
# Golden fixtures captured from the reference under Node are held as JSON
# rather than as source literals -- they are whole 48x32 grids, the same
# reason `cartalith-io` already reads its real-export capture this way.
serde_json = "1.0.151"
