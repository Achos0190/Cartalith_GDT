[package]
name = "cartalith-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "asset-pack manifest + scatter rules: frozen slot vocabularies, pack.json/pack.csv parsing, and the rule model that decides where an asset scatters (ASSET_LIBRARY_SCOPE.md milestones 1 and 3) -- no images, no zip, no gdext"

[lib]
name = "cartalith_assets"

[dependencies]
cartalith-noise = { path = "../cartalith-noise" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
