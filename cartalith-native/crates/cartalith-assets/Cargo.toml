[package]
name = "cartalith-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "asset-pack manifest + scatter rules + library model + pixels: frozen slot vocabularies, pack.json/pack.csv parsing, the rule model that decides where an asset scatters, pack .zip read/write, the Library item store, and PNG decode/encode/hash/bake (ASSET_LIBRARY_SCOPE.md milestones 1-6) -- no gdext"

[lib]
name = "cartalith_assets"

[features]
# On by default: a pack that cannot be opened is not much use. Turn it off with
# `default-features = false` to get back exactly the archive-free manifest
# model milestone 1 shipped.
default = ["zip"]
zip = ["dep:zip"]

[dependencies]
cartalith-noise = { path = "../cartalith-noise" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Same version and feature set cartalith-io already proved against real
# reference exports, so the workspace resolves a single copy.
zip = { version = "8.6.0", features = ["deflate"], optional = true }
# Milestone 6: decode/encode/resize the pixels behind an item -- crate work,
# not a hand-port (PROVENANCE.md's "take a crate for anything downstream of
# the pixels"). `default-features = false` + only the `png` codec: every
# asset this crate ever reads or writes is a PNG (packs, and the project's
# own `assetlib/img/N.png`), so the rest of `image`'s format zoo (gif/jpeg/
# webp/tiff/avif/exr/...) and its rayon/simd extras are dead weight this
# crate never calls.
image = { version = "0.25.10", default-features = false, features = ["png"] }
