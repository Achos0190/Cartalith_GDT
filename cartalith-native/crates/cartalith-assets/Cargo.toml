[package]
name = "cartalith-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "asset-pack manifest model: frozen slot vocabularies, pack.json/pack.csv parsing, validation warnings and schema-2 serialization (ASSET_LIBRARY_SCOPE.md milestone 1) -- no images, no zip, no gdext"

[lib]
name = "cartalith_assets"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
