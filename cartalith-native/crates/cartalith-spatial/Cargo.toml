[package]
name = "cartalith-spatial"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "generic tiling, dirty-tracking, draft-stack and geometry pieces with no Cartalith semantics (LOD_TILING_BASE_SCOPE.md, UNIFIED_TOOL_PLAN.md milestone A)"

[lib]
name = "cartalith_spatial"

[dependencies]
cartalith-jsmath = { path = "../cartalith-jsmath" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
